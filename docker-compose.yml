services:
  app:
    build: .
    container_name: faregraph-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://faregraph:faregraph-local@db:5432/faregraph}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-3}
      AIRPORT_CATALOG_TTL_DAYS: ${AIRPORT_CATALOG_TTL_DAYS:-7}
      RYANAIR_MIN_DELAY: ${RYANAIR_MIN_DELAY:-0}
      RYANAIR_MAX_DELAY: ${RYANAIR_MAX_DELAY:-0}
    ports:
      - "${APP_PORT:-8787}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: faregraph-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faregraph}
      POSTGRES_USER: ${POSTGRES_USER:-faregraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faregraph-local}
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  public-proxy:
    profiles: ["public-proxy"]
    image: nginx:alpine
    container_name: faregraph-public-proxy
    restart: unless-stopped
    volumes:
      - ./proxy/internal.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      br0:
        ipv4_address: 192.168.1.216
    depends_on:
      - app

networks:
  br0:
    external: true
    name: br0
