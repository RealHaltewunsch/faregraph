geo $faregraph_auth_realm {
    default "FareGraph";
    192.168.1.0/24 off;
}

server {
    listen 443 ssl;
    http2 on;
    server_name faregraph.example.com;

    ssl_certificate /etc/nginx/certs/faregraph.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/faregraph.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # LAN access plus the official Cloudflare edge networks only.
    allow 192.168.1.0/24;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # FareGraph has no user accounts, so public requests require Basic Auth.
    # The geo value above disables the prompt for local LAN clients.
    auth_basic $faregraph_auth_realm;
    auth_basic_user_file /etc/nginx/conf.d/.faregraph.htpasswd;

    client_max_body_size 2m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        proxy_pass http://192.168.1.216:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
